services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pramaan-backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DEMO=${DEMO:-0}
      - LOG_LEVEL=INFO
    volumes:
      - ./data:/app/data
      - ./configs:/app/configs
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pramaan-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
