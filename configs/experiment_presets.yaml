# Experiment presets — Pramaan AI
# Each preset defines sensible default factors + design strategy + sample sizes.

presets:
  quick:
    description: "Fast smoke test — 3 configs, 30 questions. For verifying the pipeline works."
    design_strategy: ofat
    n_questions: 30
    n_latency_repeats: 2
    factors:
      chunk_size: [256]
      chunk_overlap: [0]
      chunk_strategy: [fixed]
      top_k: [3, 5]
      embedding_model: [all-MiniLM-L6-v2]
      index_type: [flat]
      retriever: [dense]
      llm: [Qwen2.5-0.5B-Instruct-Q4_K_M]
      quantization: [Q4_K_M]
      context_budget: [2048]
      prompt_template: [plain]
    reliability_signals:
      retrieval_confidence: true
      nli_grounding: true
      entity_check: true
      token_confidence: false
      self_consistency: false
      llm_judge: false

  standard:
    description: "Standard OFAT + factorial subset — ~150 configs, 300 questions. For course submissions."
    design_strategy: ofat_then_factorial
    n_questions: 300
    n_latency_repeats: 5
    successive_halving:
      enabled: true
      initial_n: 60
      keep_fraction: 0.30
    factors:
      chunk_size: [128, 256, 512, 1024]
      chunk_overlap: [0, 0.1, 0.2]
      chunk_strategy: [fixed, recursive]
      top_k: [1, 3, 5, 8]
      embedding_model: [all-MiniLM-L6-v2, bge-small-en-v1.5, bge-base-en-v1.5]
      index_type: [flat, hnsw]
      retriever: [dense, hybrid]
      llm: [Qwen2.5-0.5B-Instruct-Q4_K_M, Qwen2.5-1.5B-Instruct-Q4_K_M, Llama-3.2-1B-Instruct-Q4_K_M]
      quantization: [Q2_K, Q4_K_M, Q8_0]
      context_budget: [2048, 4096]
      prompt_template: [plain, citation-required, abstain-allowed]
    reliability_signals:
      retrieval_confidence: true
      nli_grounding: true
      entity_check: true
      token_confidence: true
      self_consistency: false
      llm_judge: false

  full:
    description: "Full factorial Latin hypercube — all factors at all levels. Expect many hours."
    design_strategy: latin_hypercube
    n_questions: 300
    n_latency_repeats: 5
    successive_halving:
      enabled: true
      initial_n: 60
      keep_fraction: 0.30
    factors:
      chunk_size: [128, 256, 512, 1024]
      chunk_overlap: [0, 0.1, 0.2]
      chunk_strategy: [fixed, recursive, sentence-window]
      top_k: [1, 3, 5, 8, 10]
      embedding_model: [all-MiniLM-L6-v2, bge-small-en-v1.5, e5-small-v2, gte-small, bge-base-en-v1.5]
      index_type: [flat, hnsw, ivfpq]
      retriever: [dense, bm25, hybrid]
      llm: [Qwen2.5-0.5B-Instruct-Q4_K_M, Qwen2.5-1.5B-Instruct-Q4_K_M, Qwen2.5-3B-Instruct-Q4_K_M,
            Llama-3.2-1B-Instruct-Q4_K_M, Llama-3.2-3B-Instruct-Q4_K_M,
            gemma-2-2b-it-Q4_K_M, Phi-3.5-mini-instruct-Q4_K_M]
      quantization: [Q2_K, Q3_K_M, Q4_K_M, Q5_K_M, Q8_0]
      context_budget: [2048, 4096]
      prompt_template: [plain, citation-required, abstain-allowed]
    reliability_signals:
      retrieval_confidence: true
      nli_grounding: true
      entity_check: true
      token_confidence: true
      self_consistency: true
      self_consistency_n: 3
      llm_judge: false
