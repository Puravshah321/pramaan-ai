[project]
name = "pramaan-ai-backend"
version = "0.1.0"
description = "Pramaan AI backend — RAG benchmarking and reliability platform"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.1.0",

    # Data validation
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",

    # Database
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "aiosqlite>=0.20.0",

    # Large result tables
    "duckdb>=1.0.0",
    "pyarrow>=17.0.0",

    # Config / serialisation
    "pyyaml>=6.0.2",
    "python-dotenv>=1.0.0",

    # Hashing / utilities
    "xxhash>=3.4.1",
    "structlog>=24.0.0",
    "greenlet>=3.0.0",

    # Stats (Phase 5+)
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.5.0",
    "statsmodels>=0.14.0",

    # Resource telemetry
    "psutil>=6.0.0",
]

[project.optional-dependencies]
ml = [
    # Embeddings (Phase 3)
    "sentence-transformers>=3.0.0",
    "onnxruntime>=1.18.0",

    # Vector index (Phase 3)
    "faiss-cpu>=1.8.0",
    "rank-bm25>=0.2.2",

    # LLM inference (Phase 4)
    "llama-cpp-python>=0.3.0",

    # NLI / Reliability (Phase 6)
    "transformers>=4.43.0",

    # GPU telemetry (optional — installed only when NVML available)
    "pynvml>=11.5.0",

    # Energy (optional)
    "codecarbon>=2.4.0",

    # Parsing (Phase 2)
    "pypdf>=5.0.0",
    "pymupdf>=1.24.0",
    "python-docx>=1.1.0",
    "markdown>=3.7",
    "trafilatura>=1.12.0",
]

dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "hypothesis>=6.108.0",
    "pip-audit>=2.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ANN"]
ignore = ["ANN101", "ANN102", "ANN401"]
exclude = ["alembic/versions/"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
exclude = ["alembic/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=0"
